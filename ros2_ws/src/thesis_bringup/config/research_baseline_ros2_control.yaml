controller_manager:
  ros__parameters:
    # Canonical research baseline control loop.  Gazebo runs at 1 kHz in the
    # workcell, so the old 50 Hz vendor fake-hardware file left the trajectory
    # controller visibly behind the strict above-hole safety gate.
    update_rate: 250  # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6

    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 50.0
    allow_nonzero_velocity_at_trajectory_end: false
