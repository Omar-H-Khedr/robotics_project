# Cluster Run Configuration
# =========================
# SLURM and storage settings for cluster execution.

# ---------------------------------------------------------------------------
# SLURM Job Settings
# ---------------------------------------------------------------------------
slurm:
  job_name: "sac_insertion_training"
  partition: "gpu"
  account: "robotics"
  time_limit: "24:00:00"
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 8
  gres: "gpu:a100:1"

# ---------------------------------------------------------------------------
# GPU Requirements
# ---------------------------------------------------------------------------
gpu:
  type: "NVIDIA A100 40GB"
  count: 1
  min_memory: "40GB"
  cuda_version: "11.8"
  notes: "A100 40GB minimum for 72-dim obs + 6-DOF action with batch 256."

# ---------------------------------------------------------------------------
# Memory Requirements
# ---------------------------------------------------------------------------
memory:
  ram: "32GB"
  tmpfs: "10GB"
  notes: "Replay buffer (100K x 72-dim obs) ~28MB. Main overhead is model + gradients."

# ---------------------------------------------------------------------------
# Runtime Estimates
# ---------------------------------------------------------------------------
runtime:
  warmup_minutes: 5
  estimates:
    - steps: 1_000_000
      estimated_hours: 4.0
      notes: "Single-scenario, quick validation run"
    - steps: 5_000_000
      estimated_hours: 20.0
      notes: "Scenario-randomized, full training"
    - steps: 10_000_000
      estimated_hours: 40.0
      notes: "Extended training for convergence study"
  fps_estimate: 70
  notes: "FPS varies with environment complexity. A100 ~70 FPS for this config."

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
storage:
  checkpoint_dir: "/scratch/${USER}/sac_checkpoints"
  log_dir: "/scratch/${USER}/sac_logs"
  base_path: "/scratch/${USER}"
  backup_path: "/archive/${USER}/sac_runs"
  max_checkpoint_size: "500MB"
  notes: "Checkpoints saved every 10K steps (~25MB each). Keep last 5."

# ---------------------------------------------------------------------------
# Software Requirements
# ---------------------------------------------------------------------------
software:
  python: "3.10"
  cuda: "11.8"
  torch: "2.0+"
  modules:
    - "python/3.10"
    - "cuda/11.8"
  pip_packages:
    - "torch>=2.0"
    - "numpy"
    - "pyyaml"
    - "tensorboard"
