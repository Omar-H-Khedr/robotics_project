# SAC Cluster Training Configuration
# ===================================
# Modify these values for your cluster and experiment setup.

# ---------------------------------------------------------------------------
# Single-Scenario Training (no randomization)
# ---------------------------------------------------------------------------
single_scenario:
  total_steps: 1_000_000
  scenario_mode: "fixed"
  fixed_scenario:
    peg_diameter: 0.025
    hole_diameter: 0.026
    clearance: 0.001
    offset_x: 0.0
    offset_y: 0.0
  checkpoint_dir: "checkpoints/single_scenario"
  log_dir: "logs/single_scenario"

# ---------------------------------------------------------------------------
# Scenario-Randomized Training (uniform sampling)
# ---------------------------------------------------------------------------
scenario_randomized:
  total_steps: 5_000_000
  scenario_mode: "uniform"
  scenario_range:
    peg_diameter: [0.020, 0.030]
    hole_diameter: [0.021, 0.035]
    clearance: [0.0005, 0.005]
    offset_x: [-0.005, 0.005]
    offset_y: [-0.005, 0.005]
  checkpoint_dir: "checkpoints/scenario_randomized"
  log_dir: "logs/scenario_randomized"

# ---------------------------------------------------------------------------
# Training Hyperparameters
# ---------------------------------------------------------------------------
training:
  total_steps: 1_000_000
  warmup_steps: 1000
  batch_size: 256
  lr: 3.0e-4
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  auto_alpha: true
  target_entropy: -72
  hidden_dim: 256
  num_hidden_layers: 2
  replay_buffer_size: 100_000
  checkpoint_interval: 10_000
  log_interval: 1_000
  eval_interval: 50_000
  eval_episodes: 20
  scenario_mode: "uniform"
  seed: 42
  device: "cuda"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
evaluation:
  eval_episodes: 100
  held_out_episodes: 50
  held_out_scenarios: true
  deterministic: true
  seed: 42
